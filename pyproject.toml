[project]
name = "fda-patient-agent"
version = "0.1.0"
description = "ADK Patient Drug Information Agent with OpenFDA MCP, B1 translation, and LLM-as-a-Judge review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-aiplatform[agent_engines,adk]>=1.126.1",
    "google-adk>=2.0.0",
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
]


[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

